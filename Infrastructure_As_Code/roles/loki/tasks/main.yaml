

- name: Install Loki
  apt:
    name: loki
    state: present
    update_cache: true

- name: Ensure loki group exists
  ansible.builtin.group:
    name: loki
    system: true
    state: present

- name: Ensure loki user exists
  ansible.builtin.user:
    group: loki
    name: loki
    system: true
    shell: /usr/sbin/nologin
    create_home: false
- name: Ensure loki system user  exists
  ansible.builtin.user:
    name: loki
    system: true
    shell: /usr/sbin/nologin
    create_home: false
- name: Ensure backup directory exists
  file:
    path: /home/backup/loki
    state: directory
    owner: backup
    group: backup
    mode: '0640'
- name: Ensure Loki data directory exists
  file:
    path: /var/lib/loki
    state: directory
    owner: loki
    group: loki
    mode: '0755'

- name: Ensure Loki config directory exists
  file:
    path: /etc/loki
    state: directory
    owner: loki
    group: loki
    mode: '0755'
- name: Ensure Loki backup directory exists
  file:
    path: /home/backup/loki
    state: directory
    owner: backup
    group: backup
    mode: '0640'
- name: Deploy Loki configuration
  template:
    src: loki.yml.j2
    dest: /etc/loki/config.yml
    owner: loki
    group: loki
    mode: '0644'
  notify: Restart loki


- name: Enable and start Loki service
  service:
    name: loki
    enabled: true
    state: started
- name: Deploy cron tab for Loki backups
  ansible.builtin.template:
    src: backup-cron.j2
    dest: /etc/cron.d/loki-backup
    owner: root
    group: root
    mode: '0644'
  notify: Restart cron

- name: Ensure Loki CNAME exists
  no_log: true
  community.general.nsupdate:
    server: "{{ dns_primary_ip }}"
    zone: "{{ domain }}"
    record: "{{ service_cnames.loki }}"
    type: CNAME
    value: "{{ inventory_hostname }}.{{ domain }}."
    key_name: "{{ nsupdate_key_name }}"
    key_secret: "{{ dns_update_key }}"
    key_algorithm: hmac-sha256
    state: present
  when: inventory_hostname == groups['loki_server'][0]