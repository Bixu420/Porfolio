- name: Update APT cache
  ansible.builtin.apt:
    cache_valid_time: 86400
- name: Install prometheus node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
- name: Enable prometheus
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
# Lab 8

- name: Make directory for apt key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Grafana key
  ansible.builtin.get_url:
    url: 'https://packages.grafana.com/gpg.key'
    dest: '/etc/apt/keyrings/grafana.asc'

- name: Add Grafana repository
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/grafana.asc] https://packages.grafana.com/oss/deb stable main'
    state: present
- name: promtail
  apt:
    name: promtail
    state: present

- name: Ensure Promtail is installed
  ansible.builtin.apt:
    name: promtail
    state: present
- name: Ensure promtail system group exists
  ansible.builtin.group:
    name: promtail
    system: true
    state: present

- name: Ensure promtail system user exists
  ansible.builtin.user:
    name: promtail
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    group: promtail
- name: Ensure Promtail data directory exists (persistent)
  file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: '0755'

- name: Ensure Promtail config is up to date
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/promtail/config.yml

- name: Ensure promtail user has needed permissions
  user:
    name: promtail
    groups: root,adm,systemd-journal
    append: true
  notify: restart promtail

- name: Ensure Promtail service is running
  ansible.builtin.service:
    name: promtail
    state: started
    enabled: true

- name: Ensure backup user exists (or update if present)
  ansible.builtin.user:
    name: backup
    home: /home/backup
    shell: /bin/bash
    state: present
    generate_ssh_key: yes
    ssh_key_bits: 2048
    ssh_key_type: rsa
    ssh_key_file: .ssh/id_rsa
- name: Ensure backup directory exists for backup user
  file:
    path: /home/backup
    state: directory
    owner: backup
    group: backup
    mode: '0700'
- name: Ensure .ssh directory exists for backup user
  file:
    path: /home/backup/.ssh
    state: directory
    owner: backup
    group: backup
    mode: '0700'

- name: Deploy known_hosts file for backup user
  template:
    src: known_host.j2
    dest: /home/backup/.ssh/known_hosts
    owner: backup
    group: backup
    mode: '0644'
- name: ensure restore directory exists
  file:
    path: /home/backup/restore
    state: directory
    owner: backup
    group: backup
    mode: '0640'
- name: Install duplicity
  ansible.builtin.apt:
    name: duplicity
    state: present
- name: Install python3-gnupg
  ansible.builtin.apt:
    name: python3-gnupg
    state: present
- name: Install python3-boto3
  ansible.builtin.apt:
    name: python3-boto3
    state: present
- name: Install python3-pymysql
  ansible.builtin.apt:
    name: python3-pymysql
    state: present  